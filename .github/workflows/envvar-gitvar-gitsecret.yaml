name: Working with Secrets and Variables

on:
  push:
  workflow_dispatch:

env:
  APP_VERSION: "1.0.0"
  APP_NAME: "my-app"
  ENVIRONMENT: "production"

jobs:
  basic-env-vars:
    runs-on: ubuntu-latest

    env:
      APP_CLASS: "my-app-class"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print environment variables
        run: |
          echo "APP_VERSION: ${{ env.APP_VERSION }}"
          echo "APP_NAME: ${{ env.APP_NAME }}"
          echo "ENVIRONMENT: ${{ env.ENVIRONMENT }}"
          echo "APP_CLASS: ${{ env.APP_CLASS }}"

  basic-env-vars2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print environment variables
        run: |
          echo "APP_VERSION: ${{ env.APP_VERSION }}"
          echo "APP_NAME: ${{ env.APP_NAME }}"
          echo "ENVIRONMENT: ${{ env.ENVIRONMENT }}"

  basic-git-variables:
    runs-on: ubuntu-latest
    needs:
      - basic-env-vars
      - basic-env-vars2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print GitHub context variables
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Event Name: ${{ github.event_name }}"

      - name: Print Repository Variables
        run: |
          echo "Repository Variable: ${{ vars.REPOSITORY }}"

      - name: Check Secret
        run: |
          echo "MY_SECRET is configured: ${{ secrets.MY_SECRET != '' }}"